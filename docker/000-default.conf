# Apache virtual host for the Laravel app.
# The entrypoint rewrites ":80" to Render's $PORT at container start.

<VirtualHost *:80>
    # Laravel's front controller lives in /public, never the project root.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Let Laravel's public/.htaccess (pretty URLs) take effect.
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
        DirectoryIndex index.php
    </Directory>

    # Send request/error logs to the container's stdout/stderr so they
    # show up in Render's log stream instead of a file that gets wiped.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
