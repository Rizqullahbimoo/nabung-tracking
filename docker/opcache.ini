; OPcache = compiled-PHP-in-memory. Big speedup for production.

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; The code only changes when a new image is deployed, so there's no point
; re-checking file timestamps on every request.
opcache.validate_timestamps = 0
