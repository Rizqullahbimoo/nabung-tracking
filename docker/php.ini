; Production PHP overrides for the app container.
; Loaded from /usr/local/etc/php/conf.d/ (alphabetically after the defaults).

memory_limit = 256M
max_execution_time = 60

upload_max_filesize = 16M
post_max_size = 20M

expose_php = Off
date.timezone = UTC

; Show nothing sensitive to users; real errors go to the log stream.
display_errors = Off
log_errors = On
error_log = /dev/stderr
