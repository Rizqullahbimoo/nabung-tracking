<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2952E3">
    <title>Offline — Nabung Tracking</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #F4F6FB;
            color: #14161F;
            font-family: Figtree, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            max-width: 360px;
            width: 100%;
            background: #fff;
            border: 1px solid #E7E9F0;
            border-radius: 24px;
            box-shadow: 0 4px 16px rgba(20, 22, 31, 0.06);
            padding: 32px 28px;
            text-align: center;
        }
        .mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: #2952E3;
            color: #fff;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 1px;
        }
        h1 { font-size: 18px; margin: 20px 0 8px; }
        p { font-size: 14px; color: #6E7480; margin: 0 0 20px; line-height: 1.5; }
        button {
            appearance: none;
            border: 0;
            border-radius: 16px;
            background: #2952E3;
            color: #fff;
            font: inherit;
            font-weight: 600;
            padding: 12px 20px;
            cursor: pointer;
        }
        button:hover { background: #1B3BB8; }
    </style>
</head>
<body>
    <div class="card">
        <span class="mark">NT</span>
        <h1>Kamu sedang offline</h1>
        <p>Sambungan internet terputus. Halaman yang sudah pernah dibuka bisa tetap dilihat; sisanya akan tersedia lagi setelah kamu online.</p>
        <button onclick="location.reload()">Coba lagi</button>
    </div>
</body>
</html>
